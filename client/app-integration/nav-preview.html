<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nav preview</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
<style>
  /* tokens copied from the app */
  :root {
    --bg-solid: #070912; --surface-2: #131929; --surface-3: #1a2235;
    --text: #e6eaf4; --muted: #7a8499; --border: #1a2235; --border-bright: #232f4a;
    --nav-h: 56px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg-solid); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
  body::after {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(ellipse 80% 50% at 20% -10%, rgba(245,183,61,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 110%, rgba(236,93,86,0.05) 0%, transparent 60%);
  }
  .nav {
    position: sticky; top: 0; z-index: 100; height: var(--nav-h);
    background: rgba(7,9,18,0.82); backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner {
    display: flex; align-items: center; justify-content: space-between; height: 100%;
    padding: 0 1rem; max-width: 720px; margin: 0 auto; gap: 0.75rem;
  }
  /* NEW brand styles */
  .brand { display: inline-flex; align-items: center; gap: 0.5rem; flex-shrink: 0; text-decoration: none; white-space: nowrap; }
  .brand-mark { display: block; flex-shrink: 0; }
  .brand-text { font-family: 'Poppins', 'DM Sans', sans-serif; font-weight: 700; font-size: 1.05rem; letter-spacing: -0.02em; color: var(--text); }
  .brand-accent { color: #f5b73d; }
  .brand:hover .brand-accent { color: #ffce63; }

  .nav-desktop { display: flex; align-items: center; gap: 0.2rem; }
  .nav-desktop a { color: var(--muted); font-size: 0.85rem; font-weight: 500; padding: 0.35rem 0.65rem; border-radius: 7px; text-decoration: none; }
  .nav-desktop a.active { color: var(--text); background: var(--surface-3); }
  .nav-divider { width: 1px; height: 16px; background: var(--border-bright); margin: 0 0.4rem; }
  .nav-user { color: var(--muted); font-size: 0.8rem; }
  .nav-logout { background: transparent; border: none; color: var(--muted); font-size: 0.8rem; padding: 0.25rem 0.5rem; cursor: pointer; font-family: inherit; }

  .label { max-width: 720px; margin: 28px auto 0; padding: 0 1rem; color: var(--muted); font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; }
  .scene { max-width: 720px; margin: 14px auto; padding: 1rem; }
  .card { background: #0d1221; border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem; color: var(--text); }
  .card h2 { font-family: 'Playfair Display', serif; margin: 0 0 .3rem; font-size: 1.2rem; }
  .card p { color: var(--muted); margin: 0; font-size: .9rem; line-height: 1.6; }
</style>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a href="#" class="brand" aria-label="Clube do Filme">
        <svg class="brand-mark" viewBox="0 0 100 100" width="26" height="26" aria-hidden="true">
          <g transform="translate(50.9 49.3) rotate(-5)">
            <rect x="-32" y="-1" width="64" height="33" rx="5" fill="#f5b73d" />
            <rect x="-23" y="7" width="46" height="3.4" rx="1.7" fill="#181020" opacity="0.5" />
            <rect x="-23" y="16" width="34" height="3.4" rx="1.7" fill="#181020" opacity="0.5" />
            <g transform="translate(-32 -2) rotate(-13)">
              <g transform="translate(0 -14)">
                <defs><clipPath id="cdfNavBar"><rect width="64" height="14" rx="3.1" /></clipPath></defs>
                <rect width="64" height="14" rx="3.1" fill="#f5b73d" />
                <g clip-path="url(#cdfNavBar)" fill="#181020">
                  <polygon points="1.28,14 6.61,14 13.61,0 8.28,0" />
                  <polygon points="11.95,14 17.28,14 24.28,0 18.95,0" />
                  <polygon points="22.61,14 27.95,14 34.95,0 29.61,0" />
                  <polygon points="33.28,14 38.61,14 45.61,0 40.28,0" />
                  <polygon points="43.95,14 49.28,14 56.28,0 50.95,0" />
                  <polygon points="54.61,14 59.95,14 66.95,0 61.61,0" />
                </g>
              </g>
            </g>
          </g>
        </svg>
        <span class="brand-text">Clube do <span class="brand-accent">Filme</span></span>
      </a>
      <nav class="nav-desktop">
        <a href="#" class="active">Temporadas</a>
        <a href="#">Admin</a>
        <span class="nav-divider"></span>
        <span class="nav-user">Marina</span>
        <span class="nav-divider"></span>
        <button class="nav-logout">Sair</button>
      </nav>
    </div>
  </header>
  <div class="label">Preview — your nav with the new mark (browser tab icon updated too)</div>
  <div class="scene">
    <div class="card">
      <h2>Temporada 3</h2>
      <p>This is just a stand-in card to show the brand sitting in context against the app's dark surface.</p>
    </div>
  </div>
</body>
</html>
